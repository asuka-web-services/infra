- name: "📥 Get configuration status"
  ansible.netcommon.cli_command:
    command: "{{ item }}"
  loop:
    - configure
    - check configuration status
  register: raw_configuration_status
  when: not ansible_check_mode

- name: "🚩 Check if saved & if needs restart"
  ansible.builtin.set_fact:
    is_saved: >-
      {{
        'configuration status is already saved.' in raw_configuration_status.results[-1].stdout
      }}
    needs_restart: >-
      {{
        'configuration status will need restart.' in raw_configuration_status.results[-1].stdout
      }}
  when: not ansible_check_mode

- name: "💾 Save config if not saved"
  ansible.netcommon.cli_command:
    command: write memory
  when:
    - not ansible_check_mode
    - not is_saved
  check_mode: false

- name: "🔄 Restart device if required"
  ansible.netcommon.cli_command:
    command: reload y
  when:
    - not ansible_check_mode
    - needs_restart
  check_mode: false
  failed_when: false
