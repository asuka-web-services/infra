- name: "📦 Install nftables"
  ansible.builtin.package:
    name: "{{ __firewall_install_packages }}"
    state: present
  become: true

- name: "⚙️ Configure sysctl"
  ansible.builtin.template:
    src: custom.conf.j2
    dest: "{{ __firewall_sysctl_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  become: true
  notify:
    - firewall_reload_sysctl

- name: "⚙️ Configure nftables"
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ __firewall_nftables_conf_path }}"
    owner: root
    group: root
    mode: "0755"
  become: true
  notify:
    - firewall_reload_nftables

- name: "▶️ Start nftables"
  ansible.builtin.systemd_service:
    name: nftables
    state: started
    enabled: true
  become: true
