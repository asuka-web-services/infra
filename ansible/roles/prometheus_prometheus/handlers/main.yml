- name: "🔄️ Reload systemd daemon"
  ansible.builtin.systemd_service:
    daemon_reload: true
  become: true
  listen:
    - prometheus_prometheus_reload_systemd_daemon

- name: "🔄️ Restart prometheus/prometheus"
  ansible.builtin.systemd_service:
    name: prometheus
    state: restarted
  become: true
  listen:
    - prometheus_prometheus_restart_prometheus
